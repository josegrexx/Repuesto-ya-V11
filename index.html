<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Oficial - TurespuestoYa</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        /* Ajuste visual móvil: conserva la apariencia de escritorio sin alterar la lógica */
        @media (max-width: 767px) {
            html, body {
                width: 100%;
                max-width: 100%;
                overflow-x: hidden;
            }

            header {
                padding: 12px !important;
            }

            header > div {
                gap: 10px !important;
            }

            header .flex.items-center.gap-2 {
                width: 100%;
                justify-content: stretch;
            }

            header .flex.items-center.gap-2 a {
                flex: 1 1 0;
                text-align: center;
                white-space: nowrap;
            }

            section, main, #contenedorInfoBusqueda, #bannerFiltroTienda {
                box-sizing: border-box;
            }

            /* Buscador y controles permanecen ordenados y ocupan todo el ancho */
            section.max-w-7xl.mx-auto.px-4.mt-4.w-full.flex.flex-col.lg\:flex-row {
                align-items: stretch !important;
            }

            /* Mantiene las tarjetas compactas y uniformes en pantallas pequeñas */
            #gridCatalogo {
                grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
                gap: 8px !important;
            }

            #gridCatalogo > div {
                min-width: 0;
                overflow: hidden;
            }

            #gridCatalogo img {
                max-width: 100%;
            }

            /* Las categorías mantienen la misma jerarquía visual */
            #categoriasPrincipales {
                grid-template-columns: repeat(3, minmax(0, 1fr)) !important;
                gap: 8px !important;
            }

            #categoriasPrincipales .filtro-principal {
                min-width: 0;
                padding: 10px !important;
                gap: 8px !important;
            }

            #categoriasPrincipales .filtro-principal h4,
            #categoriasPrincipales .filtro-principal span {
                overflow: hidden;
                text-overflow: ellipsis;
            }

            /* Subcategorías: misma distribución horizontal, adaptada al ancho */
            #subcategoriasFiltro {
                grid-template-columns: repeat(4, minmax(0, 1fr)) !important;
                gap: 7px !important;
            }

            #subcategoriasFiltro .filtro-sub {
                min-width: 0;
                padding: 9px 7px !important;
            }

            #subcategoriasFiltro .filtro-sub span:last-child {
                overflow: hidden;
                text-overflow: ellipsis;
            }

            /* Ofertas en dos columnas como una versión compacta de escritorio */
            #gridDescuentos {
                grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
                gap: 8px !important;
            }

            /* Evita que textos largos rompan las tarjetas */
            #gridCatalogo h3,
            #gridCatalogo span,
            #gridCatalogo button,
            #gridCatalogo a {
                min-width: 0;
            }

            /* Modal siempre centrado y utilizable en celular */
            #modalZoomImagen > div,
            #modalReporte > div,
            #modalFiltroCiudad > div,
            #modalPedido > div {
                max-width: calc(100vw - 24px) !important;
                max-height: calc(100vh - 24px);
                overflow-y: auto;
            }

            #modalZoomImagen .h-\[65vh\] {
                height: 55vh !important;
            }
        }

        /* ===== MEJORAS VISUALES PARA CELULAR (bloque adicional; solo CSS) ===== */
        @media (max-width: 767px) {
            html { -webkit-text-size-adjust: 100%; }
            body { -webkit-tap-highlight-color: transparent; }
            button, a, .filtro-sub, .filtro-principal { touch-action: manipulation; }

            /* Evita el zoom automático de iOS al tocar un campo de texto */
            input, select, textarea { font-size: 16px !important; }
            #inputBuscar::placeholder { font-size: 14px; }

            /* Encabezado: más compacto y sin ocupar pantalla al hacer scroll */
            header { position: static !important; }
            header .flex.items-center.gap-2 a {
                min-height: 42px;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 12px !important;
            }

            /* Márgenes laterales más ajustados */
            section.max-w-7xl, #bannerFiltroTienda, #contenedorInfoBusqueda {
                padding-left: 12px !important;
                padding-right: 12px !important;
            }
            main.max-w-7xl { padding: 12px !important; }

            /* Ofertas: carrusel horizontal para no empujar el catálogo hacia abajo */
            #gridDescuentos {
                display: flex !important;
                overflow-x: auto;
                gap: 10px !important;
                scroll-snap-type: x mandatory;
                padding-bottom: 8px;
                -webkit-overflow-scrolling: touch;
                scrollbar-width: none;
            }
            #gridDescuentos::-webkit-scrollbar { display: none; }
            #gridDescuentos > * { flex: 0 0 86%; scroll-snap-align: start; }
            #gridDescuentos > p { flex: 0 0 100%; }
            #gridDescuentos h4 { padding-right: 42px; font-size: 12px !important; }
            #gridDescuentos [class*="text-[9px]"] { font-size: 10px !important; }
            #gridDescuentos button { padding: 8px 12px !important; font-size: 12px !important; }

            /* Controles de búsqueda: vista y ciudad a todo el ancho */
            section [class*="lg:w-auto"] { width: 100%; }
            section [class*="lg:w-auto"] > div { flex: 1 1 100%; }
            section [class*="lg:w-auto"] > div button { flex: 1; justify-content: center; padding-top: 12px; padding-bottom: 12px; }
            #btnAbrirModalCiudad { width: 100%; padding-top: 14px; padding-bottom: 14px; font-size: 13px !important; }
            #sugerenciasBusqueda { max-height: 60vh; }

            /* Avisos de búsqueda / tienda apilados */
            #bannerFiltroTienda > div, #contenedorInfoBusqueda > div {
                flex-direction: column;
                align-items: flex-start !important;
                gap: 8px;
            }
            #bannerFiltroTienda > div > button, #contenedorInfoBusqueda > div > button {
                width: 100%;
                padding-top: 10px;
                padding-bottom: 10px;
            }

            /* Categorías principales: icono arriba, texto centrado, sin cortes */
            #categoriasPrincipales .filtro-principal {

            #categoriasPrincipales .filtro-principal h4 {
                font-size: 12px !important;
                line-height: 1.15;

            }

            /* Subcategorías: cuadrícula compacta de 4 columnas, todo visible sin deslizar */
            #subcategoriasFiltro {

                gap: 5px !important;
            }
            #subcategoriasFiltro .filtro-sub {
                flex-direction: column;
                justify-content: center;

            #gridCatalogo.grid { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; gap: 8px !important; }
            #gridCatalogo.grid > div { padding: 8px !important; gap: 8px !important; border-radius: 14px !important; }
            #gridCatalogo.grid * { min-width: 0; max-width: 100%; box-sizing: border-box; }

            /* Imagen grande arriba */
            #gridCatalogo.grid .h-32 { height: 112px !important; margin-bottom: 8px !important; border-radius: 10px !important; }
            #gridCatalogo.grid .h-24 { height: 84px !important; margin-bottom: 8px !important; border-radius: 10px !important; }

            /* Etiquetas (Carro/Moto, categoría, OEM, tienda, tags): pequeñas y dentro de la tarjeta */
            #gridCatalogo.grid .justify-between { flex-direction: column; align-items: flex-start !important; gap: 4px; }
            #gridCatalogo.grid [class*="gap-1"] { gap: 4px !important; }
            #gridCatalogo.grid .flex-wrap { row-gap: 4px; }
            #gridCatalogo.grid [class*="text-[9px]"], #gridCatalogo.grid [class*="text-[10px]"] {
                font-size: 9px !important;
                padding: 2px 5px !important;
                line-height: 1.25;
                border-radius: 5px !important;
                white-space: normal;
                overflow-wrap: anywhere;
            }
            #gridCatalogo.grid span[title^="Ver catálogo"] {
                display: block;
                width: 100%;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
                font-size: 10px !important;
            }
            #gridCatalogo.grid [class*="mb-1.5"], #gridCatalogo.grid [class*="mb-2"] { margin-bottom: 5px !important; }
            #gridCatalogo.grid [class*="mt-1"] { margin-top: 4px !important; }

            /* Título en hasta 2 líneas, como en un marketplace */
            #gridCatalogo.grid h3 {
                font-size: 12px !important;
                line-height: 1.3;
                margin: 2px 0 6px !important;
                white-space: normal !important;
                display: -webkit-box !important;
                -webkit-line-clamp: 2;
                -webkit-box-orient: vertical;
                overflow: hidden;
                text-overflow: ellipsis;
                min-height: 2.6em;
            }

            /* Modelos compatibles */
            #gridCatalogo.grid .shadow-inner { padding: 6px !important; margin: 4px 0 !important; border-radius: 8px !important; }
            #gridCatalogo.grid .shadow-inner > span { display: block; margin-bottom: 3px !important; }

            /* Precio protagonista */
            #gridCatalogo.grid .text-xl { font-size: 17px !important; line-height: 1.2; }
            #gridCatalogo.grid .line-through { font-size: 10px !important; }
            #gridCatalogo.grid [class*="gap-1.5"][class*="items-center"] { flex-wrap: wrap; }
            #gridCatalogo.grid .text-right { text-align: left; }
            #gridCatalogo.grid .items-end { align-items: flex-start !important; }

            /* Zona inferior: precio, stock, ciudad y botones */
            #gridCatalogo.grid .border-t { padding-top: 8px !important; gap: 6px !important; }
            #gridCatalogo.grid .bg-slate-950.border.p-2 { padding: 5px 7px !important; border-radius: 8px !important; }
            #gridCatalogo.grid .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
            #gridCatalogo.grid > div > span.absolute { top: 6px !important; right: 6px !important; padding: 2px 6px !important; font-size: 9px !important; }

            /* Botón principal arriba y a todo el ancho; WhatsApp debajo */
            #gridCatalogo.grid div:has(> button[onclick^="abrirModalPedido"]) { flex-direction: column-reverse; align-items: stretch; gap: 6px; }
            #gridCatalogo.grid button[onclick^="abrirModalPedido"] {
                padding: 10px 6px !important;
                font-size: 12px !important;
                line-height: 1.2;
                white-space: normal;
                border-radius: 10px !important;
            }
            #gridCatalogo.grid a[href^="https://wa.me"] { padding: 8px !important; font-size: 14px !important; border-radius: 10px !important; }
            #gridCatalogo.grid .justify-end { justify-content: center; }
            #gridCatalogo button[onclick^="abrirModalReporte"] { padding: 4px 2px; min-height: 28px; }

            /* Tarjeta más corta: menos altura, mismo contenido */
            #gridCatalogo.grid > div { padding: 6px !important; gap: 5px !important; }
            #gridCatalogo.grid .h-32 { height: 84px !important; margin-bottom: 5px !important; }
            #gridCatalogo.grid .h-24 { height: 64px !important; margin-bottom: 5px !important; }

            /* Carro/Moto, categoría, OEM y tienda fluyen juntos en pocas líneas */
            #gridCatalogo.grid > div > div:first-of-type > div[class*="flex-col"] {
                flex-direction: row;
                flex-wrap: wrap;
                align-items: center;
                gap: 3px !important;
                margin-bottom: 3px !important;
            }
            #gridCatalogo.grid > div > div:first-of-type > div[class*="flex-col"] > div { display: contents; }
            #gridCatalogo.grid > div > div:first-of-type > div[class*="flex-col"] span { order: 1; }
            #gridCatalogo.grid > div > div:first-of-type > div[class*="flex-col"] span[title^="Ver catálogo"] { order: 2; width: 100%; }

            /* Título y modelos más compactos */
            #gridCatalogo.grid h3 { margin: 0 0 3px !important; min-height: 0; font-size: 11px !important; }
            #gridCatalogo.grid .shadow-inner { padding: 3px !important; margin: 2px 0 !important; }
            #gridCatalogo.grid .shadow-inner > span { display: none; }
            #gridCatalogo.grid [class*="mb-2"] { margin-bottom: 3px !important; }
            #gridCatalogo.grid [class*="mt-1"] { margin-top: 2px !important; }

            /* Precio y stock en la misma línea; ciudad sin caja */
            #gridCatalogo.grid .border-t { padding-top: 5px !important; gap: 5px !important; }
            #gridCatalogo.grid .border-t > div.justify-between { flex-direction: row; align-items: center !important; gap: 4px; }
            #gridCatalogo.grid .text-xl { font-size: 16px !important; }
            #gridCatalogo.grid .bg-slate-950.border.p-2 { padding: 0 !important; border: 0 !important; background: transparent !important; }

            /* WhatsApp y Pedir en la misma fila */
            #gridCatalogo.grid div:has(> button[onclick^="abrirModalPedido"]) { flex-direction: row; align-items: stretch; gap: 5px; }
            #gridCatalogo.grid button[onclick^="abrirModalPedido"] { flex: 1; padding: 8px 4px !important; font-size: 11px !important; }
            #gridCatalogo.grid a[href^="https://wa.me"] { padding: 6px 10px !important; flex: 0 0 auto; }

            /* Reportar: pastilla pequeña sobre la imagen, sin ocupar una fila */
            #gridCatalogo.grid .border-t > div.justify-end { position: absolute; top: 12px; left: 12px; z-index: 5; width: auto; }
            #gridCatalogo.grid button[onclick^="abrirModalReporte"] {
                background: rgba(2, 6, 23, 0.8);

                padding: 2px 6px;

                font-size: 9px !important;
            }

            /* Nombre de la tienda ENCIMA de la imagen */
            #gridCatalogo.grid > div > div:first-of-type {
                display: flex;
                flex-wrap: wrap;
                align-content: flex-start;
                gap: 3px;
            }
            #gridCatalogo.grid > div > div:first-of-type > * { flex: 0 0 100%; }
            #gridCatalogo.grid > div > div:first-of-type > div[class*="flex-col"] { display: contents; }
            #gridCatalogo.grid > div > div:first-of-type > :first-child { order: -1; }
            #gridCatalogo.grid > div > div:first-of-type > div[class*="flex-col"] span[title^="Ver catálogo"] {
                order: -2;
                flex: 0 0 100%;
                width: 100%;
                text-align: center;
                justify-content: center;
            }
            /* Insignia de oferta y Reportar bajan para no tapar el nombre de la tienda */
            #gridCatalogo.grid > div > span.absolute { top: 32px !important; right: 12px !important; }
            #gridCatalogo.grid .border-t > div.justify-end { top: 32px; left: 12px; }

            /* Orden en celular: el buscador va DEBAJO de Todos / Carros / Motos */
            header { order: 1; }
            body > section:has(#gridDescuentos) { order: 2; }
            body > section:has(#categoriasPrincipales) { order: 3; }
            body > section:has(#inputBuscar) { order: 4; }
            #contenedorInfoBusqueda { order: 5; }
            body > section:has(#subcategoriasFiltro) { order: 6; }
            #bannerFiltroTienda { order: 7; }
            main { order: 8; }

            /* Orden de importancia dentro de la tarjeta (de arriba hacia abajo):
               tienda > imagen > nombre > advertencias > Carro/Moto, categoría, OEM > modelos > Delivery/Retiro > precio, stock, ciudad, botones */
            #gridCatalogo.grid > div > div:first-of-type > h3 { order: 1; }
            #gridCatalogo.grid > div > div:first-of-type > div[class*="animate-pulse"] { order: 2; }
            #gridCatalogo.grid > div > div:first-of-type > div[class*="border-red-500/40"] { order: 3; }
            #gridCatalogo.grid > div > div:first-of-type > div[class*="flex-col"] span { order: 4; }
            #gridCatalogo.grid > div > div:first-of-type > div[class*="flex-col"] span[title^="Ver catálogo"] { order: -2; }
            #gridCatalogo.grid > div > div:first-of-type > .shadow-inner { order: 5; }
            #gridCatalogo.grid > div > div:first-of-type > div[class*="mt-1"][class*="flex-wrap"] { order: 6; }

            /* Vista de lista: tamaños más legibles */
            #gridCatalogo.flex [class*="text-[9px]"] { font-size: 10px !important; }
            #gridCatalogo.flex [class*="text-[10px]"] { font-size: 11px !important; }
            #gridCatalogo.flex button[onclick^="abrirModalPedido"] { padding-top: 12px !important; padding-bottom: 12px !important; font-size: 13px !important; }
            #gridCatalogo.flex a[href^="https://wa.me"] { padding: 12px 16px !important; font-size: 16px !important; }

            /* Vista de lista: acciones que se acomodan sin desbordar */

            #gridCatalogo.flex button[onclick^="abrirModalPedido"] { flex: 1; }

            /* Ventanas emergentes: más aire, altura real del celular y botones de cierre cómodos */

                max-height: calc(100dvh - 24px);
                padding: 16px !important;
            }
